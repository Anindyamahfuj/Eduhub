<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Page Not Found — StudyHub</title>
    <link rel="icon" href="logoedu.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
    <style>
      *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

      :root {
        --bg-0: #04070d;
        --bg-1: #080c16;
        --bg-2: #0a1020;
        --bg-3: #0d1524;
        --ink: #edf2f7;
        --ink-2: #cfd9e3;
        --muted: #8d9aa9;
        --accent: #3fd2b0;
        --accent-soft: rgba(63, 210, 176, 0.12);
        --line: rgba(148, 163, 184, 0.12);
        --r: 16px;
        --r-sm: 11px;
        --ease: cubic-bezier(0.16, 1, 0.3, 1);
        --shadow: 0 16px 40px rgba(2, 5, 10, 0.50);
      }

      body {
        font-family: "DM Sans", -apple-system, system-ui, sans-serif;
        background: var(--bg-0);
        color: var(--ink);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        -webkit-font-smoothing: antialiased;
      }

      .container {
        text-align: center;
        padding: 3rem 2rem;
        max-width: 440px;
      }

      .code {
        font-family: "Space Grotesk", "DM Sans", sans-serif;
        font-size: 7rem;
        font-weight: 700;
        color: var(--accent);
        line-height: 1;
        letter-spacing: -2px;
        margin-bottom: 0.75rem;
      }

      h1 {
        font-family: "Space Grotesk", "DM Sans", sans-serif;
        font-size: 1.5rem;
        font-weight: 600;
        color: var(--ink);
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 0.95rem;
        color: var(--muted);
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .btn {
        display: inline-block;
        padding: 0.75rem 1.75rem;
        background: var(--accent);
        color: var(--bg-0);
        text-decoration: none;
        border-radius: var(--r-sm);
        font-family: "DM Sans", sans-serif;
        font-weight: 600;
        font-size: 0.9rem;
        transition: opacity var(--dur) var(--ease);
      }

      .btn:hover {
        opacity: 0.85;
      }

      .divider {
        width: 40px;
        height: 1px;
        background: var(--line);
        margin: 0 auto 1.5rem;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <div class="divider"></div>
      <p>The page you're looking for doesn't exist or has been moved.</p>
      <a href="/" class="btn">Back to Dashboard</a>
    </div>
  </body>
</html>
