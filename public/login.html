<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub · Sign in</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700;800&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css" />
    <link rel="icon" type="image/x-icon" href="logoedu.png">
    <style>
        /* Auth gate only. Scoped to .auth-* so nothing else is affected. */
        .auth-shell {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 1.5rem;
            position: relative;
            z-index: 1;
        }
        .auth-card {
            width: 100%;
            max-width: 420px;
            background: var(--surface, rgba(9, 22, 36, 0.68));
            backdrop-filter: blur(22px) saturate(1.3);
            -webkit-backdrop-filter: blur(22px) saturate(1.3);
            border: 1px solid var(--line, rgba(125, 211, 252, 0.10));
            border-radius: var(--r, 16px);
            padding: 2rem;
            box-shadow: var(--shadow-lg, 0 24px 64px rgba(0,0,0,0.55));
        }
        .auth-brand {
            font-size: 1.5rem;
            font-weight: 700;
            letter-spacing: -0.04em;
            margin-bottom: 0.35rem;
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .auth-sub {
            color: var(--muted, #97abc2);
            font-size: 0.88rem;
            margin-bottom: 1.5rem;
        }
        .auth-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 1.1rem;
            color: var(--ink, #f0f6fc);
        }
        .auth-field { margin-bottom: 1rem; }
        .auth-field label {
            display: block;
            font-size: 0.78rem;
            font-weight: 600;
            color: var(--ink-2, #d6e2f0);
            margin-bottom: 0.4rem;
            letter-spacing: 0.02em;
        }
        .auth-field input {
            width: 100%;
            padding: 0.7rem 0.85rem;
            font-family: inherit;
            font-size: 0.92rem;
            color: var(--ink, #f0f6fc);
            background: rgba(0, 0, 0, 0.28);
            border: 1px solid var(--line-2, rgba(125, 211, 252, 0.18));
            border-radius: var(--r-sm, 11px);
            outline: none;
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .auth-field input:focus {
            border-color: var(--accent, #5eead4);
            box-shadow: 0 0 0 3px rgba(94, 234, 212, 0.14);
        }
        .auth-submit {
            width: 100%;
            padding: 0.75rem;
            margin-top: 0.35rem;
            font-family: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            color: #04121a;
            background: linear-gradient(90deg, #5eead4 0%, #7dd3fc 50%, #c4b5fd 100%);
            border: none;
            border-radius: var(--r-sm, 11px);
            cursor: pointer;
            transition: filter 0.2s, transform 0.2s;
        }
        .auth-submit:hover:not(:disabled) { filter: brightness(1.08); transform: translateY(-1px); }
        .auth-submit:disabled { opacity: 0.6; cursor: wait; }
        .auth-message {
            min-height: 1.15rem;
            margin-top: 0.85rem;
            font-size: 0.82rem;
            color: var(--muted, #97abc2);
        }
        .auth-message.is-error { color: var(--danger, #fca5a5); }
        .auth-message.is-ok { color: var(--ok, #6ee7b7); }
        .auth-switch {
            margin-top: 1.25rem;
            font-size: 0.84rem;
            color: var(--muted, #97abc2);
            text-align: center;
        }
        .auth-switch a {
            color: var(--accent, #5eead4);
            font-weight: 600;
            text-decoration: none;
            cursor: pointer;
        }
        .auth-switch a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <main class="auth-shell">
        <section class="auth-card" aria-labelledby="authTitle">
            <div class="auth-brand"><span>📘</span> <span class="brand-highlight">Study</span>Hub</div>
            <p class="auth-sub">Your all-in-one digital academic workspace.</p>

            <h1 class="auth-title" id="authTitle">Sign in to StudyHub</h1>

            <form id="authForm" novalidate>
                <div class="auth-field">
                    <label for="authEmail">Email</label>
                    <input type="email" id="authEmail" name="email" autocomplete="email" placeholder="you@example.com" required />
                </div>
                <div class="auth-field">
                    <label for="authPassword">Password</label>
                    <input type="password" id="authPassword" name="password" autocomplete="current-password" placeholder="Your password" required />
                </div>
                <button type="submit" class="auth-submit" id="authSubmit">Sign in</button>
            </form>

            <p class="auth-message" id="authMessage" role="status" aria-live="polite"></p>

            <p class="auth-switch">
                <span id="authSwitchText">New to StudyHub?</span>
                <a href="#" id="authSwitchLink">Create an account</a>
            </p>
        </section>
    </main>

    <script src="login.js"></script>
</body>
</html>
