<!DOCTYPE html>
<html lang="en">
<head><meta charset="UTF-8" /><meta name="viewport" content="width=device-width, initial-scale=1.0" /><title>StudyHub · Assignments</title><link rel="stylesheet" href="style.css" /><link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" /></head>
<body>
    <nav class="navbar"><div class="nav-container"><a href="index.html" class="nav-brand"><span class="neon-text">📘</span> <span class="brand-highlight">Study</span>Hub</a><ul class="nav-links"><li><a href="index.html"><span class="hl-purple">◆</span> Dashboard</a></li><li><a href="ai-tools.html"><span class="hl-magenta">◆</span> AI Tools</a></li><li><a href="files.html"><span class="hl-green">◆</span> Files</a></li><li><a href="habits.html"><span class="hl-orange">◆</span> Habits</a></li><li><a href="notice.html"><span class="hl-purple">◆</span> Notice</a></li><li><a href="notes.html"><span class="hl-pink">◆</span> Notes</a></li><li><a href="search.html"><span class="hl-blue">◆</span> Search</a></li><li><a href="assignments.html" class="active"><span class="hl-red">◆</span> Assignments</a></li><li><a href="planner.html"><span class="hl-cyan">◆</span> Planner</a></li><li><a href="flashcards.html"><span class="hl-orange">◆</span> Flashcards</a></li><li><a href="reading.html"><span class="hl-green">◆</span> Reading</a></li></ul><div class="nav-right"><button id="focusToggle" class="focus-toggle">🔓 Focus Off</button><span class="nav-date" id="navDate"></span></div></div></nav>
    <main class="container">
        <section class="clock-section mini-clock"><div class="clock-controls"><button id="clockToggleBtn" class="clock-toggle">⏰ Switch to Analog</button></div><div class="clock-container"><div id="digitalClock" class="digital-clock active">00:00:00</div><div id="analogClock" class="analog-clock"><canvas id="analogCanvas" width="120" height="120"></canvas></div></div><div class="clock-date" id="clockDate"></div></section>
        <header class="page-header"><h1><span class="hl-red">📋</span> <span class="neon-text">Assignments</span></h1><p>Manage deadlines, priorities, and <span class="hl-cyan">tags</span>.</p></header>
        <section class="glass-card"><form id="assignmentForm" class="flex-wrap"><input id="assignTitle" class="input-dark" placeholder="Title" required style="flex:2;"/><input id="assignSubject" class="input-dark" placeholder="Subject" style="flex:1;"/><input id="assignDue" type="date" class="input-dark" style="flex:1;"/><select id="assignPriority" class="input-dark" style="flex:1;"><option value="high">High</option><option value="medium" selected>Medium</option><option value="low">Low</option></select><input id="assignTags" class="input-dark" placeholder="Tags (comma)" style="flex:1;"/><button type="submit" class="btn-primary">➕ Add</button></form></section>
        <section class="glass-card"><h2>All Assignments</h2><div id="assignmentList"></div></section>
    </main>
    <footer class="footer"><p>© 2026 <span class="brand-highlight">Study</span>Hub</p></footer>
    <script src="script.js"></script>
</body>
</html>
