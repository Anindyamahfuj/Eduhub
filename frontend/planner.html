<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Planner - StudyHub</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">📚 StudyHub</div>
    <nav class="nav-links">
      <a href="index.html">Home</a>
      <a href="planner.html" class="active">Planner</a>
      <a href="notes.html">Notes</a>
      <a href="flashcards.html">Flashcards</a>
      <a href="assignments.html">Assignments</a>
      <a href="reading.html">Reading</a>
      <a href="notice.html">Notice</a>
    </nav>
    <button id="trashBtn" class="trash-btn" onclick="openTrash()">🗑️ Trash <span id="trashCount">0</span></button>
  </header>

  <main class="container">
    <h1>📅 Study Planner</h1>
    <p class="subtitle">Let AI build a smart study schedule for you, or plan manually.</p>

    <!-- AI Planner Section -->
    <section class="card ai-card">
      <h2>🤖 AI Planner</h2>
      <p class="hint">Tell the AI what you need, or pick a quick preset:</p>

      <div class="ai-input-row">
        <input type="text" id="plannerAiInput" placeholder="e.g., I have math exam on Friday and physics project due Monday">
        <button id="plannerAiBtn" class="btn primary" onclick="runPlannerAI()">✨ Generate Plan</button>
      </div>

      <div class="quick-prompts">
        <button class="chip" onclick="setPlannerPrompt('auto')">⚡ Auto Schedule</button>
        <button class="chip" onclick="setPlannerPrompt('simple')">🌱 Simple Day</button>
        <button class="chip" onclick="setPlannerPrompt('exam')">📝 Exam Week</button>
        <button class="chip" onclick="setPlannerPrompt('weekend')">🎉 Weekend Plan</button>
        <button class="chip" onclick="setPlannerPrompt('math-morning-physics-evening')">🧮 Math Morning + ⚛️ Physics Evening</button>
        <button class="chip" onclick="setPlannerPrompt('random')">🎲 Random Mix</button>
        <button class="chip" onclick="setPlannerPrompt('3hours')">⏰ Today 3 Hours</button>
      </div>

      <div id="plannerAiOutput" class="ai-output" style="display:none;"></div>
    </section>

    <!-- Manual Add -->
    <section class="card">
      <h2>➕ Add Study Slot Manually</h2>
      <form id="plannerForm" onsubmit="return addPlannerSlot(event)">
        <div class="form-row">
          <input type="text" id="plannerTitle" placeholder="Activity title *" required>
          <select id="plannerSubject">
            <option value="Math">Math</option>
            <option value="Physics">Physics</option>
            <option value="Chemistry">Chemistry</option>
            <option value="Biology">Biology</option>
            <option value="English">English</option>
            <option value="History">History</option>
            <option value="Computer Science">Computer Science</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-row">
          <select id="plannerDay">
            <option value="Monday">Monday</option>
            <option value="Tuesday">Tuesday</option>
            <option value="Wednesday">Wednesday</option>
            <option value="Thursday">Thursday</option>
            <option value="Friday">Friday</option>
            <option value="Saturday">Saturday</option>
            <option value="Sunday">Sunday</option>
          </select>
          <input type="time" id="plannerStart">
          <input type="time" id="plannerEnd">
          <select id="plannerPriority">
            <option value="low">🟢 Low</option>
            <option value="medium" selected>🟡 Medium</option>
            <option value="high">🔴 High</option>
          </select>
        </div>
        <button type="submit" class="btn primary">➕ Add Slot</button>
      </form>
    </section>

    <!-- Weekly Grid -->
    <section class="card">
      <div class="card-header-row">
        <h2>📊 Weekly Schedule</h2>
        <button class="btn danger-outline" onclick="clearAllPlanner()">🧹 Clear All</button>
      </div>
      <div id="plannerGrid" class="planner-grid">
        <!-- Days will be rendered here -->
      </div>
    </section>
  </main>

  <!-- Trash Modal -->
  <div id="trashModal" class="modal" style="display:none;">
    <div class="modal-content">
      <div class="modal-header">
        <h2>🗑️ Trash</h2>
        <button class="close-btn" onclick="closeTrash()">✕</button>
      </div>
      <div class="modal-body">
        <div id="trashList" class="trash-list">
          <p class="empty-state">Trash is empty.</p>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn danger" onclick="emptyTrash()">⚠️ Empty All Trash</button>
        <button class="btn" onclick="closeTrash()">Close</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="eduhub-ai.js"></script>
</body>
</html>
