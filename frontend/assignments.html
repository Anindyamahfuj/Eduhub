<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignments — StudyHub</title>

    <!-- shared project styles (keep as in your other pages) -->
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="eduhub-ai.css">
    <link rel="stylesheet" href="eduhub-theme.css">

    <!-- Phosphor icons + fonts (same as the rest of StudyHub) -->
    <link rel="stylesheet" href="https://unpkg.com/@phosphor-icons/web@2.1.1/src/regular/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">

    <style>
        /* add-assignment form layout (page-scoped) */
        .as-form { display:grid; grid-template-columns:2fr 1fr 1fr 1fr; gap:.6rem; margin-bottom:.6rem; }
        .as-form .as-tags-row { grid-column:1 / -1; display:flex; gap:.6rem; }
        .as-form input, .as-form select {
            background:var(--surface-2, rgba(148,163,184,.06));
            border:1px solid var(--line, #2a3648);
            border-radius:10px; padding:.6rem .75rem;
            color:var(--ink, #edf2f7); font:500 13.5px var(--font, inherit); outline:none;
        }
        .as-form input:focus, .as-form select:focus { border-color:var(--accent, #3fd2b0); }
        @media (max-width: 760px) { .as-form { grid-template-columns:1fr 1fr; } }
    </style>
</head>
<body>

<!-- ============================================================
     NAVBAR — swap for your own navbar if you prefer;
     the only required element for the features below is #trashBtn.
     ============================================================ -->
<nav class="navbar">
    <div class="nav-container">
        <a href="index.html" class="nav-logo"><i class="ph ph-graduation-cap" aria-hidden="true"></i> StudyHub</a>
        <ul class="nav-links">
            <li><a href="index.html">Home</a></li>
            <li><a href="notes.html">Notes</a></li>
            <li><a href="notice.html">Notices</a></li>
            <li><a href="assignments.html" class="active">Assignments</a></li>
            <li><a href="planner.html">Planner</a></li>
            <li><a href="flashcards.html">Flashcards</a></li>
            <li><a href="reading.html">Reading</a></li>
            <li><a href="ai-tools.html">AI Tools</a></li>
        </ul>
        <div class="nav-right">
            <button id="trashBtn" class="focus-toggle" type="button">
                <i class="ph ph-trash" aria-hidden="true"></i> Trash (0)
            </button>
        </div>
    </div>
</nav>

<main class="container" style="padding-top:1.4rem; padding-bottom:3rem;">

    <section class="glass-card" style="padding:1.3rem;">
        <h2 style="margin-top:0;"><i class="ph ph-clipboard-text" aria-hidden="true"></i> Assignments</h2>

        <form id="assignmentForm" autocomplete="off">
            <div class="as-form">
                <input id="assignTitle" type="text" placeholder="Assignment title *" required>
                <select id="assignSubject"></select>
                <input id="assignDue" type="date" required>
                <select id="assignPriority">
                    <option value="low">Low priority</option>
                    <option value="medium" selected>Medium priority</option>
                    <option value="high">High priority</option>
                </select>
                <div class="as-tags-row">
                    <input id="assignTags" type="text" placeholder="Tags, comma separated (e.g. chapter 4, lab)">
                    <button type="submit" class="btn-primary" style="white-space:nowrap;">
                        <i class="ph ph-plus" aria-hidden="true"></i> Add
                    </button>
                </div>
            </div>
        </form>

        <!-- list + filters + progress (rendered by script.js) -->
        <div id="assignmentList" aria-live="polite"></div>
    </section>

</main>

<!-- ============================================================
     SCRIPTS — script.js contains ALL AI features now (planner AI,
     summarizer, quiz, flashcard auto-gen + unified Trash).
     eduhub-ai.js is legacy — do NOT load it.
     ============================================================ -->
<script src="script.js"></script>
<script src="eduhub-shortcuts.js"></script>
<script src="eduhub-dock.js"></script>
<script src="eduhub-cinema.js"></script>
<script src="eduhub-translate.js"></script>
</body>
</html>
