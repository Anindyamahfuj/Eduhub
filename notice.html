<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>StudyHub · Noticeboard</title>
    <link rel="stylesheet" href="style.css" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="nav-brand"><span class="neon-text">📘</span> <span class="brand-highlight">Study</span>Hub</a>
            <ul class="nav-links">
                <li><a href="index.html"><span class="hl-cyan">◆</span> Dashboard</a></li>
                <li><a href="ai-tools.html"><span class="hl-magenta">◆</span> AI Tools</a></li>
                <li><a href="files.html"><span class="hl-green">◆</span> Files</a></li>
                <li><a href="habits.html"><span class="hl-orange">◆</span> Habits</a></li>
                <li><a href="notice.html" class="active"><span class="hl-purple">◆</span> Notice</a></li>
                <li><a href="notes.html"><span class="hl-pink">◆</span> Notes</a></li>
                <li><a href="search.html"><span class="hl-blue">◆</span> Search</a></li>
            </ul>
            <div class="nav-right">
                <span class="nav-date" id="navDate"></span>
            </div>
        </div>
    </nav>

    <main class="container">
        <section class="clock-section mini-clock">
            <div class="clock-controls">
                <button id="clockToggleBtn" class="clock-toggle">⏰ Switch to Analog</button>
            </div>
            <div class="clock-container">
                <div id="digitalClock" class="digital-clock active">00:00:00</div>
                <div id="analogClock" class="analog-clock">
                    <canvas id="analogCanvas" width="120" height="120"></canvas>
                </div>
            </div>
            <div class="clock-date" id="clockDate"></div>
        </section>

        <header class="page-header">
            <h1><span class="hl-purple">📢</span> <span class="neon-text">Noticeboard</span></h1>
            <p>Pin important <span class="hl-purple">announcements</span> or <span class="hl-cyan">reminders</span> for your study group.</p>
        </header>

        <section class="notice-add-section glass-card">
            <div class="notice-add-form">
                <input type="text" id="noticeInput" placeholder="✍️ Write a notice..." />
                <button id="addNoticeBtn" class="btn-primary">📌 Pin <span class="hl-purple">Notice</span></button>
            </div>
            <button id="deleteAllNoticesBtn" class="btn-danger">🗑️ <span class="hl-red">Delete All</span></button>
        </section>

        <section class="notice-board glass-card">
            <div class="notice-board-header">
                <h2><span class="hl-purple">📌</span> <span class="neon-text">Pinboard</span></h2>
                <span class="notice-count" id="noticeCount">0 notices</span>
            </div>
            <div id="noticeList" class="notice-list">
                <p class="empty-state">No notices <span class="hl-purple">pinned</span> yet.</p>
            </div>
        </section>
    </main>

    <footer class="footer">
        <p>© 2026 <span class="brand-highlight">Study</span>Hub · built for <span class="hl-cyan">focus</span> &amp; <span class="hl-magenta">growth</span></p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
